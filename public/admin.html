<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel · CelsMarket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Outfit:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="login" class="login hide">
  <img src="/logo.png" alt="CelsMarket Uy" style="height:90px;width:auto;align-self:center">
  <label style="display:flex;flex-direction:column;gap:8px;color:#c3c7d0">Contraseña<input id="pw" class="in" type="password" autocomplete="current-password"></label>
  <button id="go" class="btn">Entrar</button><p id="loginMsg" class="msg"></p>
</div>
<div id="app" class="wrap hide">
  <header class="top"><div style="display:flex;align-items:center;gap:14px"><img src="/logo.png" alt="CelsMarket Uy" style="height:56px;width:auto"><span class="badge">Panel privado</span></div><button class="out" id="logout">Cerrar sesión</button></header>
  <div class="tabs" id="tabs"></div>
  <main id="view"></main>
</div>
<script src="/admin.js"></script>
</body>
